name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}

      - name: Resolve API URL from stack
        id: api
        working-directory: scripts/get-api-url
        run: go run .

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Deploy CDK stack
        working-directory: infra
        run: cdk deploy --require-approval never --ci
